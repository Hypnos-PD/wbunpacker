[package]
name = "svwb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "svwb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svwb-core = { path = "../svwb-core" }
catalog-release = { path = "../catalog-release" }
toml = "0.8"
